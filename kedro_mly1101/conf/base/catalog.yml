# Catálogo de datos — el ÚNICO lugar del proyecto donde hay rutas.
#
# Un solo hilo: Perception v2 real. Los nodos conocen los datos por su nombre;
# dónde viven y en qué formato se declara aquí. Cambiar a un Volume de Databricks
# (Delta) es editar este archivo y ni una línea del análisis
# (ver docs/databricks_free.md y el bloque 7 del notebook 04).
#
# Las capas siguen la convención de Kedro:
#   01_raw          lo que llegó, no se toca
#   02_intermediate diagnósticos y tablas de trabajo
#   03_primary      el dataset limpio, listo para modelar

# --------------------------------------------------------------------------
# 01_raw — Perception v2. No está en el repositorio (licencia Waymo).
#   python herramientas/descargar_waymo.py --muestra 40
# --------------------------------------------------------------------------
waymo_muestra:
  type: partitions.PartitionedDataset
  path: ../datos/waymo_real/muestra
  dataset: pandas.ParquetDataset
  filename_suffix: ".parquet"

# La ingesta traduce la muestra a esta tabla. Los notebooks leen el mismo archivo.
detecciones_reales:
  type: pandas.ParquetDataset
  filepath: ../datos/waymo_real/detecciones_reales.parquet

# --------------------------------------------------------------------------
# 02_intermediate — otras fuentes locales (se ven; el RF no las usa)
#   camera_box: cajas 2D en píxeles (traducidas). Un fotograma se dibuja
#   en el notebook 14 etapa F, no aquí: Kedro no pinta JPEG.
#   E2E: JSON de 479 clusters, no el video de 1,6 GB.
#   Databricks / Spark: solo detecciones_reales (v2). No montes el bucket GCS.
# --------------------------------------------------------------------------
inventario_fuentes_waymo:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/inventario_fuentes_waymo.csv
  save_args:
    index: false

cajas_camara_2d:
