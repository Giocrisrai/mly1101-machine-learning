# --------------------------------------------------------------------------
# Datos REALES de Waymo (opcionales)
#
# NO están en el repositorio: la licencia de Waymo es de uso no comercial y
# prohíbe redistribuirlos. Se descargan con herramientas/descargar_waymo.py
# tras aceptar los términos en https://waymo.com/open/terms/
#
# Sin ellos, `kedro run` (el pipeline por defecto) funciona igual: solo el
# pipeline `waymo_real` los necesita.
# --------------------------------------------------------------------------
# Varios segmentos, no uno: con un solo segmento no se puede partir en
# entrenamiento y prueba sin fuga (todas las detecciones comparten contexto).
#   python herramientas/descargar_waymo.py --muestra 40
waymo_muestra:
  type: partitions.PartitionedDataset
  path: ../datos/waymo_real/muestra
  dataset: pandas.ParquetDataset
  filename_suffix: ".parquet"

detecciones_reales:
  type: pandas.ParquetDataset
  filepath: data/01_raw/detecciones_reales.parquet

comparacion_real_vs_sintetico:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/comparacion_real_vs_sintetico.csv
  save_args:
    index: false

