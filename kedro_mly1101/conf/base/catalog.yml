# Catálogo de datos — el ÚNICO lugar del proyecto donde hay rutas.
#
# Los nodos conocen los datos por su nombre; dónde viven y en qué formato se
# declara aquí. Por eso cambiar de CSV local a Delta Lake en Databricks es editar
# este archivo y ni una línea del análisis (ver el bloque 6 del notebook 04).
#
# Las capas siguen la convención de Kedro:
#   01_raw          lo que llegó, no se toca
#   02_intermediate diagnósticos y tablas de trabajo
#   03_primary      el dataset limpio, listo para modelar

# --------------------------------------------------------------------------
# 01_raw — la entrada. Ruta relativa a la raíz de ESTE proyecto, no del repo.
# --------------------------------------------------------------------------
detecciones_crudas:
  type: pandas.CSVDataset
  filepath: ../datos/crudos/detecciones_waymo_like.csv

# --------------------------------------------------------------------------
# 02_intermediate — salidas del diagnóstico de calidad (EA1, Actividad 1.3)
# --------------------------------------------------------------------------
resumen_calidad:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/resumen_calidad.csv
  save_args:
    index: true

desbalance_clases:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/desbalance_clases.csv
  save_args:
    index: true

valores_imposibles:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/valores_imposibles.csv
  save_args:
    index: false

nulos_por_grupo:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/nulos_por_grupo.csv
  save_args:
    index: true

# --------------------------------------------------------------------------
# 03_primary — el dataset limpio.
#
# Parquet y no CSV, por lo medido en la Actividad 1.2: pesa 0,40x y es el único
# formato que conserva los dtypes. Guardar aquí en CSV desharía el trabajo de
# preprocesamiento en el momento de escribirlo.
# --------------------------------------------------------------------------
detecciones_limpias:
  type: pandas.ParquetDataset
  filepath: data/03_primary/detecciones_limpias.parquet

informe_limpieza:
  type: pandas.CSVDataset
  filepath: data/03_primary/informe_limpieza.csv
  save_args:
    index: false

# --------------------------------------------------------------------------
# EA2 · Aprendizaje supervisado
# --------------------------------------------------------------------------
tabla_modelamiento:
  type: pandas.ParquetDataset
  filepath: data/04_feature/tabla_modelamiento.parquet

particion_por_segmento:
  type: pandas.ParquetDataset
  filepath: data/05_model_input/particion_por_segmento.parquet

clasificador:
  type: pickle.PickleDataset
  filepath: data/06_models/clasificador.pickle

metricas_por_clase:
  type: pandas.CSVDataset
  filepath: data/07_model_output/metricas_por_clase.csv
  save_args:
    index: false

matriz_confusion:
  type: pandas.CSVDataset
  filepath: data/07_model_output/matriz_confusion.csv
  save_args:
    index: true

comparacion_particiones:
  type: pandas.CSVDataset
  filepath: data/07_model_output/comparacion_particiones.csv
  save_args:
    index: false

fuga_de_variable:
  type: pandas.CSVDataset
  filepath: data/07_model_output/fuga_de_variable.csv
  save_args:
    index: false
