# Parámetros del pipeline.
#
# Aquí viven las DECISIONES, no el código que las aplica. Es la diferencia que
# más cuesta ver al empezar con Kedro: cambiar un umbral o agregar una variante
# de escritura no debería exigir tocar Python ni volver a probar nada.
#
# Cada bloque corresponde a una fila de la tabla de decisiones del RA1.

# Variantes de escritura que hay que unificar (defectos 3 y 4 del dataset).
mapas_categorias:
  object_type:
    peaton: pedestrian
    ped: pedestrian
  weather:
    lluvia: rain
    soleado: sunny
    niebla: fog

# Valores que representan un dato faltante sin ser NaN (defectos 1 y 2).
centinelas:
  num_lidar_points: -1

# Reglas de dominio: describen filas IMPOSIBLES, no atípicas.
# Un bus de 15 m es atípico y legítimo; una altura de 0 m es imposible.
#
# Cada regla declara DOS cosas y las dos hacen falta:
#   condicion: qué filas son inválidas (se evalúa con DataFrame.eval)
#   columna:   cuál es el dato que hay que marcar como faltante
#
# Podría parecer redundante, porque casi siempre la columna es la que abre la
# condición. No lo es: en cuanto una regla menciona dos columnas
# ("num_lidar_points < 0 or speed_mps > 100") deducir la columna del texto
# limpiaría solo la primera, y en silencio. Declararla es lo que evita ese fallo.
reglas_dominio:
  altura nula o negativa:
    condicion: box_height <= 0
    columna: box_height
  largo negativo:
    condicion: box_length < 0
    columna: box_length
  ancho negativo:
    condicion: box_width < 0
    columna: box_width
  velocidad superior a 100 m/s:
    condicion: speed_mps > 100
    columna: speed_mps
  puntos laser negativos:
    condicion: num_lidar_points < 0
    columna: num_lidar_points

# Columnas que no aportan información a un modelo.
# sensor_version es constante (varianza cero); id_interno es casi único, así que
# un modelo con capacidad suficiente lo memoriza y el rendimiento en test se cae.
columnas_a_descartar:
  - sensor_version

# Para el análisis de sesgo: qué faltante se cruza contra qué grupo.
sesgo:
  columna: speed_mps
  grupos:
    - time_of_day
    - detection_difficulty

# ---------------------------------------------------------------------------
# RA2 · Act. 2.2 · Aprendizaje supervisado
# ---------------------------------------------------------------------------
# La pregunta: ¿se puede anticipar qué detecciones van a ser DIFÍCILES a partir
# de la geometría del objeto y de dónde está?
#
# Se descartó clasificar object_type, que parecía lo natural: se resuelve al
# 99,98 % porque el generador sortea las dimensiones por tipo de objeto. Un
# ejercicio donde todo sale perfecto no enseña a evaluar.
modelo:
  objetivo: detection_difficulty

  # El segmento es la unidad de AGRUPACIÓN para partir el dataset.
  # No es una variable del modelo: si lo fuera, aprendería a reconocer segmentos.
  grupo: segment_id

  # num_lidar_points NO está en esta lista, y es deliberado: la etiqueta se
  # deriva de esa columna, así que incluirla sería contarle al modelo la
  # respuesta. El nodo comparar_fuga_de_variable mide cuánto infla la métrica.
  variables:
    - box_length
    - box_width
    - box_height
    - box_center_x
    - box_center_y
    - box_center_z
    - speed_mps

  proporcion_prueba: 0.25
  semilla: 42

  n_arboles: 200
  profundidad_maxima: 12

# La variable excluida a propósito, para poder medir el efecto de incluirla.
fuga:
  variable: num_lidar_points

# ---------------------------------------------------------------------------
# RA2 · Act. 2.3 · Aprendizaje no supervisado
# ---------------------------------------------------------------------------
# La pregunta: sin decirle a nadie qué es cada objeto, ¿aparecen grupos
# naturales? ¿Y coinciden con los tipos que el sensor etiquetó?
agrupamiento:
  variables:
    - box_length
    - box_width
    - box_height
    - speed_mps
    - num_lidar_points

  # object_type NO se usa para agrupar. Se guarda para contrastar después si la
  # estructura que apareció sola tiene una lectura de dominio.
  etiqueta_de_contraste: object_type

  k_a_probar: [2, 3, 4, 5, 6, 8]
  k: 4
  muestra_silueta: 5000
  semilla: 42

# ---------------------------------------------------------------------------
# RA3 · Optimización, ensamble y validación
# ---------------------------------------------------------------------------
# Todo se valida con GroupKFold sobre segment_id, por el mismo motivo que la
# partición de la Actividad 2.2: las detecciones de un segmento comparten
# contexto y no pueden repartirse entre pliegues.
ajuste:
  metrica: f1_macro       # no accuracy: el problema está desbalanceado 89/11
  n_pliegues: 5
  n_combinaciones: 12     # búsqueda aleatoria, no exhaustiva

  # Espacio de búsqueda del bosque aleatorio.
  n_estimators: [50, 100, 200, 400]
  max_depth: [4, 6, 8, 12, 16, null]
  min_samples_leaf: [1, 5, 20, 50]
  max_features: ["sqrt", "log2", 0.5]
